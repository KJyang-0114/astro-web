name: ci-gate

# PR 上跑；main 上的檢查由 deploy-macmini.yml 用 workflow_call 呼叫（所以這裡不加 push: main，避免跑兩次）。
#
# 2026-11-20 起所有工作都跑在 Mac mini 上的 runner 容器（deploy/ci-runner/Dockerfile，README「CI runner」），
# 不用 GitHub 代管機器：
#   astro-web-ci-build  會跑 PR 的程式碼（npm ci、npm run check），不拿任何 secret
#   astro-web-ci-gate   不跑 repo 的程式碼：部署、Claude 審查、合併決定、通知
# runs-on 一律寫滿三個標籤；不要只寫 self-hosted（可能落到別的 runner）。
#
# fork 的 PR 不跑（job 的 if）。注意這擋不住 fork 自己改過的 workflow 檔，真正的防線是 repo 設定的
# 「fork PR 的 workflow 要核准」，見 README「CI runner」。
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # job 名稱就是 check 名稱：.github/scripts/claude-gate-decide.sh 認 `ci-gate` 這個名字。
  ci-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, astro-web-ci, astro-web-ci-build]
    timeout-minutes: 20
    # 放在 job 層級而不是 workflow 層級：被 deploy-macmini.yml 呼叫時，取消只會影響這個檢查 job，
    # 不會碰到呼叫端的 deploy job。群組名稱不用 github.workflow（被呼叫時會變成呼叫端的名字）。
    # 同一個 PR 再 push 時，舊的檢查會被取消，不會重複排隊。
    concurrency:
      group: ci-gate-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # 與 Dockerfile 的 node:22-slim 一致；runner image 的 tool cache 已有 Node 22，不用下載。
          # 不用 npm cache：容器每個工作後會清掉 HOME，存到 GitHub cache 反而更慢。
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # lint → astro check → build → verify:static → rebuild-docker.sh 假指令測試
      - name: npm run check
        run: npm run check

      # runner 裡沒有 Docker：用 image 內建的 nginx 以 runner 身分載入 docker/nginx-site.conf，
      # 送上一步 build 出的 dist/，只打 127.0.0.1。Dockerfile 本身由部署時主機上的 rebuild-docker.sh
      # 建置並做健康檢查（失敗自動退回上一版）。
      - name: npm run verify:runtime (nginx, no Docker)
        run: npm run verify:runtime -- --nginx
