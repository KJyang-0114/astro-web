name: Deploy to Mac mini

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-macmini
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MACMINI_HOST: ${{ secrets.MACMINI_HOST }}
      MACMINI_USER: ${{ secrets.MACMINI_USER }}
      MACMINI_PORT: ${{ secrets.MACMINI_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.MACMINI_DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH
        shell: bash
        run: |
          test -n "$MACMINI_HOST"
          test -n "$MACMINI_USER"
          test -n "$DEPLOY_PATH"
          test "$DEPLOY_PATH" != "/"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.MACMINI_SSH_KEY }}" > ~/.ssh/macmini_deploy_key
          chmod 600 ~/.ssh/macmini_deploy_key
          ssh-keyscan -p "$MACMINI_PORT" "$MACMINI_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to Mac mini
        shell: bash
        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".astro/" \
            --exclude ".docker-build-config/" \
            --exclude "dist/" \
            --exclude "node_modules/" \
            --exclude "*.log" \
            -e "ssh -i ~/.ssh/macmini_deploy_key -p $MACMINI_PORT" \
            ./ "$MACMINI_USER@$MACMINI_HOST:$DEPLOY_PATH/"

      - name: Rebuild Docker container
        shell: bash
        run: |
          ssh -i ~/.ssh/macmini_deploy_key -p "$MACMINI_PORT" "$MACMINI_USER@$MACMINI_HOST" \
            "cd '$DEPLOY_PATH' && chmod +x ./rebuild-docker.sh && ./rebuild-docker.sh"
