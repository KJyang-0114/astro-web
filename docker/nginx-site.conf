# 容器內的 nginx：直接送 dist 裡的靜態檔。
# /healthz 是 Mac mini 看門狗（~/scripts/watchdog/checks.conf）在檢查的網址，拿掉會每小時報警一次。
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /_assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /.well-known/api-catalog { default_type application/linkset+json; try_files $uri =404; }
    location = /.well-known/site-status { default_type application/json; try_files $uri =404; }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
